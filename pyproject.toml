[project]
name = "soundings"
version = "0.0.0"
description = "Measure hardware MIDI tone generators and record what they answer"
readme = "README.md"
requires-python = ">= 3.11"
license = { text = "MIT" }
dependencies = [
    "python-rtmidi>=1.5.8",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
soundings = "soundings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/soundings"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
